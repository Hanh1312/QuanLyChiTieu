<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quỹ tiết kiệm</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
  </head>

  <body>
    <div class="container mt-4">
      <h2 class="mb-4">💰 Quỹ tiết kiệm</h2>

      <form action="/add_saving" method="POST" class="card p-3 mb-4">
        <div class="row">
          <div class="col-md-2">
            <input type="date" name="date" class="form-control" required />
          </div>

          <div class="col-md-2">
            <select name="type" class="form-control">
              <option value="Deposit">Gửi quỹ</option>

              <option value="Withdraw">Rút quỹ</option>
            </select>
          </div>

          <div class="col-md-3">
            <input
              type="number"
              name="amount"
              class="form-control"
              placeholder="Số tiền"
              required />
          </div>

          <div class="col-md-3">
            <input
              type="text"
              name="note"
              class="form-control"
              placeholder="Ghi chú" />
          </div>

          <div class="col-md-2">
            <button class="btn btn-success w-100">Lưu</button>
          </div>
        </div>
      </form>
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Ngày</th>
            <th>Loại</th>
            <th>Số tiền</th>
            <th>Ghi chú</th>
          </tr>
        </thead>

        <tbody>
          {% for item in savings %}

          <tr>
            <td>{{ item.SavingDate }}</td>

            <td>
              {% if item.Type == "Deposit" %}
              <span class="badge bg-success"> Gửi quỹ </span>
              {% else %}
              <span class="badge bg-danger"> Rút quỹ </span>
              {% endif %}
            </td>

            <td>{{ "{:,.0f}".format(item.Amount).replace(",", ".") }} đ</td>

            <td>{{ item.Note }}</td>
          </tr>

          {% endfor %}
        </tbody>
      </table>

      <a href="/dashboard" class="btn btn-secondary"> Quay lại </a>
    </div>
  </body>
</html>
