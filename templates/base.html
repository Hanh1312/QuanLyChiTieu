<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Quản Lý Chi Tiêu
        {% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body id="body">

<button
        class="menu-toggle"
        onclick="toggleSidebar()">

    <i class="bi bi-list"></i>

</button>

<div id="overlay"
     onclick="toggleSidebar()">
</div>

<div class="container-fluid">

    <div class="row">

        <!-- SIDEBAR -->

        <div class="col-lg-2 sidebar p-4"
             id="sidebar">

            <h4 class="sidebar-title mb-4">

                💰 Chi Tiêu

            </h4>

            <a href="/dashboard">

                <i class="bi bi-speedometer2"></i>

                Dashboard

            </a>

            <a href="/transactions">

                <i class="bi bi-cash-stack"></i>

                Giao dịch

            </a>

            <a href="/debt-pay">

                <i class="bi bi-credit-card"></i>

                Nợ phải trả

            </a>

            <a href="/debt-receive">

                <i class="bi bi-wallet2"></i>

                Tiền cho vay

            </a>

            <a href="/report">

                <i class="bi bi-bar-chart"></i>

                Thống kê

            </a>

            <a href="/logout">

                <i class="bi bi-box-arrow-right"></i>

                Đăng xuất

            </a>

            <hr>

            <button
                id="darkBtn"
                class="btn btn-sm btn-dark w-100">

                🌙 Dark Mode

            </button>

        </div>

        <!-- CONTENT -->

        <div class="col-lg-10 p-4 main-content">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>

<script>

function toggleSidebar()
{
    document
        .getElementById("sidebar")
        .classList
        .toggle("show");

    document
        .getElementById("overlay")
        .classList
        .toggle("show");
}

const darkBtn =
document.getElementById("darkBtn");

if(localStorage.getItem("darkMode") === "on")
{
    document
        .getElementById("body")
        .classList
        .add("dark-mode");
}

darkBtn.addEventListener("click", () =>
{
    document
        .getElementById("body")
        .classList
        .toggle("dark-mode");

    if(
        document
        .getElementById("body")
        .classList
        .contains("dark-mode")
    )
    {
        localStorage.setItem(
            "darkMode",
            "on"
        );
    }
    else
    {
        localStorage.removeItem(
            "darkMode"
        );
    }
});

</script>

</body>
</html>
