<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Sửa khoản cho vay</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
  </head>

  <body class="container mt-5">
    <h2>Sửa khoản cho vay</h2>

    <form method="POST">
      <div class="mb-3">
        <label>Người vay</label>

        <input
          type="text"
          name="person"
          class="form-control"
          value="{{ debt.PersonName }}"
          required />
      </div>

      <div class="mb-3">
        <label>Số tiền</label>

        <input
          type="number"
          name="amount"
          class="form-control"
          value="{{ debt.Amount }}"
          required />
      </div>

      <div class="mb-3">
        <label>Hạn thu</label>

        <input
          type="date"
          name="due_date"
          class="form-control"
          value="{{ debt.DueDate }}"
          required />
      </div>

      <div class="mb-3">
        <label>Ghi chú</label>

        <textarea name="note" class="form-control">{{ debt.Note }}</textarea>
      </div>

      <button class="btn btn-primary">Lưu thay đổi</button>
    </form>
  </body>
</html>
