<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sửa giao dịch</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}" />
  </head>

  <body>
    <div class="card shadow p-4">
      <h2 class="mb-4">Sửa giao dịch</h2>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label"> Loại giao dịch </label>
          <select name="type" class="form-select">
            <option value="Income"
                {{ "selected" if transaction["Type"] == "Income" else "" }}>
                Thu nhập
            </option>

            <option value="Expense"
                {{ "selected" if transaction["Type"] == "Expense" else "" }}>
                Chi tiêu
            </option>
        </select>
        </div>
        <div class="mb-3">
          <label class="form-label"> Danh mục </label>
          <input
            type="text"
            name="category"
            class="form-control"
            value="{{ transaction.Category }}"
            required />
        </div>
        <div class="mb-3">
          <label class="form-label"> Số tiền </label>
          <input
            type="number"
            name="amount"
            class="form-control"
            value="{{ transaction.Amount }}"
            required />
        </div>
        <div class="mb-3">
          <label class="form-label"> Ghi chú </label>
          <textarea name="note" rows="4" class="form-control">
{{ transaction.Note }}</textarea
          >
        </div>
        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        <a href="/transactions" class="btn btn-secondary"> Quay lại </a>
      </form>
    </div>
  </body>
</html>
